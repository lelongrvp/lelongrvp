<svg xmlns="http://www.w3.org/2000/svg" width="600" height="196" viewBox="0 0 600 196" role="img" aria-labelledby="title description">
<title id="title">Status</title>
<desc id="description">Status panel. Role: Software Engineer. Base: Hanoi, Vietnam. Active since August 2023. Focus: Databricks, AWS, game making.</desc>
<style>
{{FONT_FACES}}
text{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#ebdbb2}
.label{font-size:14px;font-weight:700;letter-spacing:2px;fill:#fe8019}
.key{font-size:14px;font-weight:700;letter-spacing:2px;fill:#d5c4a1}
.body{font-size:17px}
.small{font-size:15px}
.secondary{fill:#d5c4a1}
.muted{fill:#928374}
.strong{font-weight:700}
.accent{fill:#fe8019}
.ok{fill:#b8bb26}
.alert{fill:#fb4934}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes type{from{transform:scaleX(1)}to{transform:scaleX(0)}}
@keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(3.2);opacity:0}}
.cursor{opacity:0;animation:blink 1.1s steps(1) infinite}
.cover{transform-box:fill-box;transform-origin:right center}
.ring{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.cover{transform:scaleX(0)}.cursor{opacity:1}.ring{opacity:0}}

</style>
<defs><pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#1d2021" opacity=".35"/></pattern></defs>
<rect x=".5" y=".5" width="599" height="195" fill="#282828" stroke="#3c3836"/>
<rect x=".5" y=".5" width="599" height="40" fill="#3c3836"/>
<rect width="4" height="196" fill="#fe8019"/>
<text class="label" x="22" y="26">SECTOR 00 :: STATUS</text>
<text class="label ok" x="576" y="26" text-anchor="end">ONLINE</text>
<circle class="ring" cx="500" cy="21" r="4" fill="#b8bb26"/>
<circle cx="500" cy="21" r="4" fill="#b8bb26"/>
<text class="key" x="24" y="80">ROLE</text>
<text class="body" x="170" y="80">Software Engineer</text>
<text class="key" x="24" y="112">BASE</text>
<text class="body" x="170" y="112">Hanoi, Vietnam</text>
<text class="key" x="24" y="144">SINCE</text>
<text class="body" x="170" y="144">August 2023</text>
<text class="key" x="24" y="176">FOCUS</text>
<text class="body" x="170" y="176">Databricks · AWS · game making</text>
<rect width="600" height="196" fill="url(#scanlines)"/>
</svg>
